name: Build & Push Multi-Version Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images ke registry'
        required: true
        type: boolean
        default: true
      phalcon_version:
        description: 'Versi Phalcon'
        required: true
        type: string
        default: '5.23.0'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            is_latest: true
          - php: '8.3'
            is_latest: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_images)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_images) && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tentukan Tags Docker
        id: meta
        run: |
          PHP_VER="${{ matrix.php }}"
          IS_LATEST="${{ matrix.is_latest }}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          TAGS=""
          # GHCR Tags
          TAGS="ghcr.io/${OWNER_LC}/fpm-php8-phalcon5:${PHP_VER}"
          if [ "$IS_LATEST" = "true" ]; then
            TAGS="${TAGS},ghcr.io/${OWNER_LC}/fpm-php8-phalcon5:latest"
          fi
          
          # Docker Hub Tags (hanya jika DOCKERHUB_USERNAME tersedia)
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/fpm-php8-phalcon5:${PHP_VER}"
            if [ "$IS_LATEST" = "true" ]; then
              TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/fpm-php8-phalcon5:latest"
            fi
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHALCON_VERSION=${{ inputs.phalcon_version || '5.23.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
